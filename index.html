<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暴力转转转</title>
<style>
  :root {
    --size: min(70vw, 70vh, 1200px);
    /* 字体在上一版基础上再 ×1.25 */
    --fs-base: clamp(19px, 1.125vw + 12.5px, 45px);
    --fs-lg:   clamp(23px, 1.5vw + 15px, 60px);
    --fs-xl:   clamp(28px, 2vw + 17.5px, 75px);
    --fs-sm:   clamp(16px, 0.875vw + 11px, 35px);
    --fs-xs:   clamp(15px, 0.69vw + 10px, 30px);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: clamp(12px, 2vw, 48px);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: var(--fs-base);
    color: #202331;
    /* 使用你提供的背景图，铺满全屏 */
    background: url("./空.png") center / cover no-repeat fixed;
    display: flex; justify-content: center; align-items: center;
  }
  .app {
    width: min(1600px, 100%);
    display: grid;
    grid-template-columns: minmax(280px, 1fr) minmax(280px, 420px);
    gap: clamp(20px, 2.5vw, 56px);
    align-items: center;
  }
  .wheel-panel { display:flex; flex-direction:column; align-items:center; gap: clamp(14px, 1.8vw, 32px); min-width:0; }
  .wheel-wrap {
    position:relative; width:var(--size); height:var(--size); max-width:100%; aspect-ratio:1;
    filter: drop-shadow(0 16px 25px #26304a2b);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .wheel-wrap:focus-visible { outline:3px solid #8178fa; outline-offset:6px; border-radius:50%; }
  canvas { display:block; width:100%; height:100%; }
  .pointer {
    position:absolute; z-index:3; left:50%; top:-5px; transform:translateX(-50%);
    width:0;height:0;
    border-left: clamp(12px, 1.8vmin, 32px) solid transparent;
    border-right: clamp(12px, 1.8vmin, 32px) solid transparent;
    border-top: clamp(28px, 4.2vmin, 68px) solid #24283b;
    filter:drop-shadow(0 3px 2px #0003);
  }
  .hub {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:13%; aspect-ratio:1; border-radius:50%; border: clamp(3px, 0.5vmin, 10px) solid #fff;
    background:linear-gradient(145deg,#30364f,#121522); box-shadow:0 3px 12px #0004; pointer-events:none;
  }
  .fs-result {
    display:none; position:absolute; left:50%; top:50%;
    transform:translate(-50%, 23vmin);
    max-width:80%; padding:.34em 1em; border-radius:999px;
    background:rgba(24,28,44,.74); color:#fff;
    font-size:clamp(25px, 6.25vmin, 100px); font-weight:850; letter-spacing:1px;
    text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    box-shadow:0 10px 28px #00000033; backdrop-filter:blur(6px);
    pointer-events:none; z-index:4;
  }
  .main-button {
    border:0; border-radius:999px;
    padding: clamp(10px, 1.2vw, 24px) clamp(28px, 3.5vw, 72px);
    min-width: clamp(160px, 16vw, 320px);
    color:white;
    font-size: var(--fs-lg);
    font-weight:800; letter-spacing:2px; cursor:pointer;
    background:linear-gradient(135deg,#7167f8,#5144dc); box-shadow:0 8px 20px #6457e044;
    transition:transform .15s, opacity .2s;
  }
  .main-button:hover { transform:translateY(-2px); }
  .main-button:active { transform:translateY(1px); }
  .main-button:disabled { opacity:.65; cursor:wait; }
  .side {
    background:rgba(255,255,255,.82); border:1px solid rgba(255,255,255,.9);
    border-radius: clamp(16px, 1.8vw, 32px);
    padding: clamp(16px, 2vw, 36px);
    box-shadow:0 12px 40px #28334d22; backdrop-filter:blur(16px);
  }
  h1 { font-size: var(--fs-xl); margin:0 0 8px; }
  .sub { color:#777d91; font-size: var(--fs-sm); margin:0 0 18px; line-height:1.6; }
  label { display:block; font-weight:750; margin-bottom:8px; font-size: var(--fs-base); }
  textarea {
    width:100%; min-height: clamp(160px, 20vh, 320px); resize:vertical;
    border:1px solid #dfe2ed; border-radius:13px;
    padding: clamp(10px, 1vw, 18px);
    font: var(--fs-base)/1.8 inherit; font-family:inherit; outline:none; background:#fbfcff;
  }
  textarea:focus { border-color:#8178fa; box-shadow:0 0 0 3px #8178fa20; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:12px 0 14px; color:#6c7184; font-size: var(--fs-sm); }
  .count { background:#f0efff; color:#6256e8; border-radius:999px; padding:5px 12px; font-weight:750; white-space:nowrap; font-size: var(--fs-sm); }
  .secondary {
    border:1px solid #e0e3ee; background:#fff; color:#3b4054; border-radius:10px;
    padding: clamp(8px, 0.9vw, 16px) clamp(10px, 1vw, 18px);
    cursor:pointer; font-weight:650; font-family:inherit;
    font-size: var(--fs-sm);
    transition:background .15s, transform .15s;
  }
  .secondary:hover { background:#f5f6fc; }
  .secondary:active { transform:translateY(1px); }
  .btn-row { display:flex; gap:10px; }
  .btn-row .secondary { flex:1; }
  .result { margin-top:18px; padding: clamp(12px, 1.3vw, 22px); background:#f6f5ff; border:1px solid #e8e5ff; border-radius:14px; }
  .result-title { color:#77758e; font-size: var(--fs-xs); font-weight:750; letter-spacing:1px; }
  .winner { min-height:1.4em; margin-top:5px; font-size: var(--fs-xl); font-weight:850; overflow-wrap:anywhere; color:#5144dc; }
  .hint { margin-top:12px; color:#85899a; font-size: var(--fs-xs); line-height:1.6; }

  .fs-exit {
    display:none; position:fixed; top:16px; right:18px; z-index:99;
    width: clamp(40px, 3.5vmin, 60px); height: clamp(40px, 3.5vmin, 60px); border-radius:50%; border:0;
    background:#ffffffee; color:#4a4f66; font-size: clamp(16px, 1.8vmin, 26px); line-height:1; cursor:pointer;
    box-shadow:0 4px 14px #0000001f; opacity:.28; transition:opacity .2s, transform .15s;
    align-items:center; justify-content:center;
  }
  .fs-exit:hover, .fs-exit:focus-visible { opacity:1; }
  .fs-exit:active { transform:scale(.94); }

  body.fullscreen-mode {
    --size: min(96vw, 96vh);
    padding:0; overflow:hidden;
  }
  body.fullscreen-mode .app {
    grid-template-columns: 1fr;
    width:100vw; height:100vh; gap:0;
  }
  body.fullscreen-mode .side,
  body.fullscreen-mode .main-button { display:none; }
  body.fullscreen-mode .wheel-panel { gap:0; }
  body.fullscreen-mode .fs-exit { display:flex; }
  body.fullscreen-mode .fs-result { display:block; }

  /* 2K+ */
  @media (min-width: 2000px) {
    :root {
      --size: min(65vw, 65vh, 1400px);
      --fs-base: clamp(25px, 1.06vw + 10px, 53px);
      --fs-lg:   clamp(30px, 1.375vw + 12.5px, 70px);
      --fs-xl:   clamp(38px, 1.75vw + 15px, 90px);
      --fs-sm:   clamp(20px, 0.81vw + 10px, 40px);
      --fs-xs:   clamp(18px, 0.625vw + 9px, 35px);
    }
    .app { width: min(1800px, 100%); grid-template-columns: minmax(400px, 1fr) minmax(360px, 480px); }
  }

  /* 4K */
  @media (min-width: 3000px) {
    :root {
      --size: min(58vw, 58vh, 1600px);
      --fs-base: clamp(30px, 0.94vw + 7.5px, 60px);
      --fs-lg:   clamp(35px, 1.25vw + 10px, 80px);
      --fs-xl:   clamp(45px, 1.56vw + 12.5px, 105px);
      --fs-sm:   clamp(23px, 0.69vw + 7.5px, 45px);
      --fs-xs:   clamp(20px, 0.56vw + 6px, 38px);
    }
    .app { width: min(2000px, 100%); grid-template-columns: minmax(500px, 1fr) minmax(400px, 520px); }
  }

  @media (max-width:800px) {
    body { padding:18px 12px; align-items:flex-start; }
    .app { grid-template-columns:1fr; gap:22px; }
    :root { --size: min(88vw, 55vh, 560px); }
    .side { padding:20px; }
    textarea { min-height:150px; }
  }
</style>
</head>
<body>
<div class="app">
  <main class="wheel-panel">
    <div class="wheel-wrap" id="wheelWrap" tabindex="0" role="button" aria-label="点击转盘开始或停止">
      <div class="pointer" aria-hidden="true"></div>
      <canvas id="wheel" aria-label="抽选转盘"></canvas>
      <div class="hub"></div>
      <div class="fs-result" id="fsResult" aria-live="polite">等待开始</div>
    </div>
    <button class="main-button" id="spinButton">开始</button>
  </main>

  <aside class="side">
    <h1>暴力转转转</h1>
    <p class="sub">输入就完事了</p>
    <label for="options">转盘选项</label>
    <textarea id="options" spellcheck="false">雪
秋
爱
天
雨</textarea>
    <div class="row">
      <span class="count" id="count">5 个选项</span>
    </div>
    <div class="btn-row">
      <button class="secondary" id="shuffleColors">🎨 重新配色</button>
      <button class="secondary" id="fullscreenBtn">⛶ 全屏模式</button>
    </div>
    <div class="result">
      <div class="result-title">本次抽中</div>
      <div class="winner" id="winner">等待开始</div>
    </div>
    <div class="hint">别看了 直接暴力点暴力抽</div>
  </aside>
</div>

<button class="fs-exit" id="fsExit" title="退出全屏（Esc）">✕</button>

<script>
(() => {
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const textarea = document.getElementById('options');
  const button = document.getElementById('spinButton');
  const countEl = document.getElementById('count');
  const winnerEl = document.getElementById('winner');
  const fsResult = document.getElementById('fsResult');
  const wheelWrap = document.getElementById('wheelWrap');
  const fsExit = document.getElementById('fsExit');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const TAU = Math.PI * 2;
  const palette = [
    '#F94144','#F3722C','#F9C74F','#90BE6D','#43AA8B','#4D908E',
    '#577590','#277DA1','#7B61FF','#B565D9','#F15BB5','#FF8FAB',
    '#00B4D8','#80ED99','#C77DFF','#FF9F1C','#6C9A8B','#E76F51',
    '#A8DADC','#457B9D','#D4A5A5','#8D99AE','#BC6C25','#6D597A'
  ];
  const NAME_COLORS = {
    '雪': '#FFFFFF',
    '秋': '#F59E0B',
    '爱': '#F472B6',
    '天': '#93C5FD',
    '雨': '#1E40AF'
  };
  let colors = [], items = [], rotation = 0, phase = 'idle';
  let raf = 0, lastTime = 0, startTime = 0, startRotation = 0, targetRotation = 0;
  let stopRequested = false;

  function setWinnerText(t) {
    winnerEl.textContent = t;
    fsResult.textContent = t;
  }

  function isLightColor(c) {
    if (!c) return false;
    let r, g, b;
    if (c[0] === '#') {
      let hex = c.slice(1);
      if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
      r = parseInt(hex.slice(0,2),16);
      g = parseInt(hex.slice(2,4),16);
      b = parseInt(hex.slice(4,6),16);
    } else {
      const m = c.match(/hsl\(\s*([\d.]+)\s*[, ]\s*([\d.]+)%\s*[, ]\s*([\d.]+)%/i);
      if (!m) return false;
      const h = +m[1], s = +m[2]/100, l = +m[3]/100;
      const a = s * Math.min(l, 1-l);
      const f = n => {
        const k = (n + h/30) % 12;
        return l - a * Math.max(-1, Math.min(k-3, 9-k, 1));
      };
      r = Math.round(f(0)*255); g = Math.round(f(8)*255); b = Math.round(f(4)*255);
    }
    return (0.299*r + 0.587*g + 0.114*b) > 150;
  }

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function getItems() {
    return textarea.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  }

  function setItems() {
    if (phase !== 'idle') return;
    items = getItems();
    if (!items.length) items = ['请添加选项'];
    colors = items.map((name, i) =>
      NAME_COLORS[name] || colors[i] || palette[i % palette.length]
    );
    countEl.textContent = `${items.length} 个选项`;
    setWinnerText('等待开始');
    draw();
  }

  function shuffleColors() {
    colors = items.map((name, i) =>
      NAME_COLORS[name] || `hsl(${Math.floor(Math.random()*360)} 76% ${48 + Math.floor(Math.random()*9)}%)`
    );
    draw();
  }

  function draw() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    const cx = w/2, cy = h/2, r = Math.min(w,h)/2 - 8;
    ctx.clearRect(0,0,w,h);
    const n = items.length || 1, slice = TAU/n;
    for (let i=0;i<n;i++) {
      const a0 = rotation - Math.PI/2 + i*slice;
      const a1 = a0 + slice;
      const bg = colors[i] || palette[i % palette.length];

      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a0,a1); ctx.closePath();
      ctx.fillStyle = bg; ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(2, w/250); ctx.stroke();

      ctx.save();
      const mid = a0 + slice/2;
      ctx.translate(cx + Math.cos(mid)*r*0.64, cy + Math.sin(mid)*r*0.64);
      ctx.rotate(mid + Math.PI/2);
      const fontSize = Math.max(17, Math.min(w * 0.075, 300 / n + 12, 90));
      ctx.font = `800 ${fontSize}px system-ui, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const light = isLightColor(bg);
      ctx.lineWidth = Math.max(2.5, fontSize * 0.15);
      ctx.strokeStyle = light ? 'rgba(255,255,255,.85)' : 'rgba(0,0,0,.23)';
      const label = items[i].length > 16 ? items[i].slice(0,15)+'…' : items[i];
      ctx.strokeText(label, 0, 0, r*0.48);
      ctx.fillStyle = light ? '#242a3d' : '#fff';
      ctx.fillText(label, 0, 0, r*0.48);
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.lineWidth=Math.max(4, w/160); ctx.strokeStyle='#fff'; ctx.stroke();
  }

  function easeInCubic(t) { return t*t*t; }
  function easeOutQuint(t) { return 1 - Math.pow(1-t, 5); }

  function animate(now) {
    if (!lastTime) lastTime = now;
    const dt = Math.min((now-lastTime)/1000, .05);
    lastTime = now;
    if (phase === 'accelerating') {
      const t = Math.min((now-startTime)/1500, 1);
      const ramp = easeInCubic(t);
      rotation += dt * (0.5 + ramp * 15.5);
      if (t >= 1) phase = 'spinning';
    } else if (phase === 'spinning') {
      rotation += dt * 16;
    } else if (phase === 'decelerating') {
      const t = Math.min((now-startTime)/targetDuration, 1);
      rotation = startRotation + (targetRotation-startRotation) * easeOutQuint(t);
      if (t >= 1) {
        rotation = targetRotation % TAU;
        phase = 'idle';
        button.disabled = false;
        button.textContent = '再转一次';
        stopRequested = false;
        showWinner();
        draw();
        cancelAnimationFrame(raf);
        raf = 0;
        return;
      }
    }
    draw();
    raf = requestAnimationFrame(animate);
  }

  let targetDuration = 8000;
  function startSpin() {
    if (phase !== 'idle') return;
    if (!getItems().length) { setWinnerText('请先添加选项'); return; }
    setItems();
    phase = 'accelerating';
    stopRequested = false;
    button.textContent = '停止';
    setWinnerText('转盘转动中…');
    lastTime = 0; startTime = performance.now();
    raf = requestAnimationFrame(animate);
  }

  function stopSpin() {
    if (phase === 'idle' || phase === 'decelerating') return;
    phase = 'decelerating';
    startTime = performance.now();
    startRotation = rotation;
    const n = items.length, slice = TAU/n;
    const chosen = Math.floor(Math.random()*n);
    const nearBoundary = Math.random() < 0.42;
    const offset = nearBoundary
      ? (Math.random() < .5 ? 0.008 : slice - 0.008)
      : slice * (0.12 + Math.random()*0.76);
    const desiredRotation = ((TAU - (chosen*slice + offset)) % TAU);
    const currentMod = ((rotation % TAU) + TAU) % TAU;
    let delta = (desiredRotation - currentMod + TAU) % TAU;
    delta += TAU * (5 + Math.floor(Math.random()*3));
    targetRotation = rotation + delta;
    targetDuration = 10500 + Math.random()*3500;
    button.textContent = '减速停止中…';
    button.disabled = true;
  }

  function showWinner() {
    const n = items.length, slice = TAU/n;
    const a = (((-rotation) % TAU) + TAU) % TAU;
    const idx = Math.floor(a / slice) % n;
    setWinnerText(items[idx] || '完成');
  }

  function handleToggle() {
    if (phase === 'idle') startSpin();
    else if (phase !== 'decelerating') stopSpin();
  }

  button.addEventListener('click', handleToggle);
  wheelWrap.addEventListener('click', handleToggle);
  wheelWrap.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      handleToggle();
    }
  });

  textarea.addEventListener('input', () => {
    if (phase === 'idle') setItems();
  });
  document.getElementById('shuffleColors').addEventListener('click', shuffleColors);
  window.addEventListener('resize', resizeCanvas);

  let pseudoFs = false;
  const isFs = () => !!document.fullscreenElement || !!document.webkitFullscreenElement || pseudoFs;

  function updateFsClass() {
    document.body.classList.toggle('fullscreen-mode', isFs());
    requestAnimationFrame(resizeCanvas);
  }

  function enterFullscreen() {
    pseudoFs = true;
    updateFsClass();
    const el = document.documentElement;
    if (el.requestFullscreen) {
      el.requestFullscreen().catch(() => {});
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    }
  }

  function exitFullscreen() {
    pseudoFs = false;
    if (document.fullscreenElement && document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }
    updateFsClass();
  }

  fullscreenBtn.addEventListener('click', () => {
    if (isFs()) exitFullscreen(); else enterFullscreen();
  });
  fsExit.addEventListener('click', exitFullscreen);

  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) pseudoFs = false;
    updateFsClass();
  });
  document.addEventListener('webkitfullscreenchange', () => {
    if (!document.webkitFullscreenElement) pseudoFs = false;
    updateFsClass();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && isFs()) exitFullscreen();
  });

  if (window.ResizeObserver) {
    let roRaf = 0;
    new ResizeObserver(() => {
      cancelAnimationFrame(roRaf);
      roRaf = requestAnimationFrame(resizeCanvas);
    }).observe(wheelWrap);
  }

  items = getItems();
  colors = items.map((name, i) => NAME_COLORS[name] || palette[i % palette.length]);
  resizeCanvas();
  setItems();
})();
</script>
</body>
</html>
